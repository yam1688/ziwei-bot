# Fly.io 部署配置
# 部署命令：
#   fly launch --region hkg
#   fly secrets set BOT_TOKEN=8936592956:AAE1h-S8HSHaQu66aQWtXLCPvWJyq1c3FQU
#   fly deploy

app = "ziwei-doushu-bot"

[build]
  dockerfile = "Dockerfile"

[[services]]
  internal_port = 8080
  protocol = "tcp"

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [[services.ports]]
    port = 443
    handlers = ["tls"]

  [[services.tcp_checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"
